<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký tài khoản - Figure & Friends</title>
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="style.css">
    <script>
        // Kiểm tra ngay lập tức trước khi trang được render
        (function() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'light') {
                document.documentElement.classList.add('light-mode');
            }
        })();
    </script>
</head>
<body>
    <div class="gundam-lineart-wrapper">
        <img src="gundam-lineart.png" alt="Gundam Lineart" class="gundam-img">
        <div class="scanning-light"></div>
    </div>
    <!-- Header & Nav -->
    <header>
        <div class="nav-container">
            <a href="Home.html" class="logo">
                <img src="Logo.png"></img> Figure & Friends
            </a>

            <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" placeholder="Tìm kiếm sản phẩm, nhà sản xuất,...">
            </div>

            <div class="nav-actions">
                <!-- Nút chuyển đổi Sáng / Tối -->
                <button id="theme-toggle" class="theme-btn" title="Chuyển đổi giao diện">
                    <i class="bi bi-moon-stars-fill" id="theme-icon"></i>
                </button>

                <!-- Khu vực Tài khoản có Dropdown -->
                <div class="account-dropdown">
                    <a href="javascript:void(0);" id="account-btn" class="account-toggle">
                        <i class="bi bi-person-circle"></i> <span id="account-text">Tài khoản</span> <i class="bi bi-chevron-down"></i>
                    </a>
                    
                    <!-- Hộp menu thả xuống (Mặc định sẽ ẩn đi) -->
                    <div class="dropdown-content" id="dropdown-box">
                        <!-- TRƯỜNG HỢP 1: Chưa đăng nhập -->
                        <div id="guest-menu">
                            <a href="login.html"><i class="bi bi-box-arrow-in-right"></i> Đăng nhập</a>
                            <a href="register.html"><i class="bi bi-person-plus"></i> Đăng ký</a>
                        </div>
                        
                        <!-- TRƯỜNG HỢP 2: Đã đăng nhập (Bạn có thể ẩn/hiện bằng JS sau này) -->
                        <div id="user-menu" style="display: none;">
                            <a href="profile.html"><i class="bi bi-person-badge"></i> Trang cá nhân</a>
                            <a href="#" id="logout-btn"><i class="bi bi-box-arrow-right"></i> Đăng xuất</a>
                        </div>
                    </div>
                </div>

                <a href="#">
                    <i class="bi bi-cart3"></i> Giỏ hàng
                    <span class="badge"></span>
                </a>
            </div>
        </div>
    </header>
    <main class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <i class="bi bi-cpu-fill auth-icon"></i>
                <h2>ĐĂNG KÝ TÀI KHOẢN</h2>
                <p>Khởi tạo trạm thành viên Figure & Friends</p>
            </div>

            <form class="auth-form">
                <div class="input-group">
                    <label><i class="bi bi-person-fill"></i> Họ và tên</label>
                    <input type="text" placeholder="Nhập họ tên của bạn..." required>
                </div>

                <div class="input-group">
                    <label><i class="bi bi-envelope-fill"></i> Địa chỉ Email</label>
                    <input type="email" placeholder="Nhập email..." required>
                </div>

                <div class="input-group">
                    <label><i class="bi bi-key-fill"></i> Mật khẩu</label>
                    <input type="password" placeholder="Tạo mật khẩu..." required>
                </div>

                <div class="input-group">
                    <label><i class="bi bi-shield-check"></i> Xác nhận mật khẩu</label>
                    <input type="password" placeholder="Nhập lại mật khẩu..." required>
                </div>

                <button type="submit" class="auth-btn">
                    <i class="bi bi-person-plus-fill"></i> KHỞI TẠO TÀI KHOẢN
                </button>
            </form>

            <div class="auth-footer">
                <p>Đã có tài khoản rồi? <a href="login.html">Đăng nhập tại đây</a></p>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
